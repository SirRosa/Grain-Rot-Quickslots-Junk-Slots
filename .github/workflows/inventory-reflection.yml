name: Inspect Grain Rot inventory reflection
on:
  push:
    paths:
      - tools/inventory_reflection_audit.py
      - .github/workflows/inventory-reflection.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inventory:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: SirRosa/Grain-Rot-Mod-Data-Base
          path: reference
      - name: Examine exact reflected fields
        run: python3 tools/inventory_reflection_audit.py
