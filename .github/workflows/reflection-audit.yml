name: Helden reflection audit
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/reflection-audit.yml'
      - 'tools/reflection_audit.py'
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: SirRosa/Grain-Rot-Mod-Data-Base
          path: knowledge
      - name: Inspect actual UE5.7 reflection and methods
        run: python3 tools/reflection_audit.py knowledge
